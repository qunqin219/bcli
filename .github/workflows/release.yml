name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib
          tag = os.environ["TAG"].lstrip("v")
          meta = pathlib.Path("pyproject.toml").read_text()
          ver = re.search(r'^version = "([^"]+)"', meta, re.M).group(1)
          print(f"tag={tag} pyproject={ver}")
          if tag != ver:
              sys.exit("tag 与 pyproject 版本不一致")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if f"## {tag}" not in changelog:
              sys.exit(f"CHANGELOG.md 缺少 ## {tag} 段落")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[qr]" pyinstaller
      - name: Build one-file binary
        run: pyinstaller --onefile --name bili --paths . --collect-all qrcode --collect-submodules bilicli scripts/entry.py
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/bili.exe "out/bili-${{ matrix.name }}.exe"
          else
            cp dist/bili "out/bili-${{ matrix.name }}"
            chmod +x "out/bili-${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: out/*

  release:
    needs: [build-dist, binaries]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Arrange assets
        run: |
          mkdir -p assets
          cp artifacts/dist/*.whl artifacts/dist/*.tar.gz assets/ 2>/dev/null || true
          find artifacts -name 'bili-*' -type f -exec cp {} assets/ \;
          cd assets
          sha256sum bili-* *.whl *.tar.gz > checksums.txt
          cd ..
          ls -lh assets
      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v v="## ${VERSION}" 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG 里没有 ${VERSION} 段落" >&2
            printf 'See [CHANGELOG.md](https://github.com/qunqin219/bcli/blob/master/CHANGELOG.md).\n' > notes.md
          fi
          echo "--- notes ---"
          cat notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: notes.md

  pypi:
    needs: [build-dist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  tap:
    needs: [release, build-dist, binaries]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Render formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SHA_LINUX=$(sha256sum artifacts/bin-linux-x64/* | cut -d' ' -f1)
          SHA_LINUX_ARM=$(sha256sum artifacts/bin-linux-arm64/* | cut -d' ' -f1)
          SHA_MACOS=$(sha256sum artifacts/bin-macos-arm64/* | cut -d' ' -f1)
          SHA_SDIST=$(sha256sum artifacts/dist/*.tar.gz | cut -d' ' -f1)
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s/__SHA_LINUX__/${SHA_LINUX}/g" \
              -e "s/__SHA_LINUX_ARM__/${SHA_LINUX_ARM}/g" \
              -e "s/__SHA_MACOS__/${SHA_MACOS}/g" \
              -e "s/__SHA_SDIST__/${SHA_SDIST}/g" \
              packaging/bili.rb.tmpl > bili.rb
          echo "--- rendered ---"
          head -20 bili.rb
      - name: Push to homebrew-tap
        env:
          SSH_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:qunqin219/homebrew-tap.git tap
          cp bili.rb tap/Formula/bili.rb
          cd tap
          git config user.name "观澜"
          git config user.email "193301971+qunqin219@users.noreply.github.com"
          git add Formula/bili.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
          else
            git commit -m "bili ${TAG#v}"
            git push origin HEAD:master
          fi
