name: integration

on:
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[qr]"
      - name: Run live read-only tests
        env:
          BILI_INTEGRATION: "1"
          BCLI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          BCLI_JCT: ${{ secrets.BILI_BILI_JCT }}
          BCLI_UID: ${{ secrets.BILI_UID }}
        run: python -m unittest tests.test_integration -v
