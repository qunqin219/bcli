[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcli"
version = "0.1.0"
description = "A small, dependency-light Bilibili CLI with an agent-friendly envelope"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qr = ["qrcode>=7.4", "pillow>=10"]

[project.scripts]
bcli = "bcli.cli:main"

[tool.setuptools]
packages = ["bcli"]
